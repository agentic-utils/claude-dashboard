name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    # Serialise releases: never cancel a publish mid-flight (half-tagged /
    # half-pushed Homebrew tap), queue the next one behind it instead.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create release
        if: steps.tag.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --latest

      # ponytail: no build artefacts, so the formula just points at the tag tarball
      - name: Update Homebrew tap
        if: steps.tag.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
          VERSION: ${{ steps.tag.outputs.new_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/agentic-utils/homebrew-tap" tap
          cd tap
          sed -i -e "s|^  url \".*\"|  url \"$url\"|" \
                 -e "s|^  version \".*\"|  version \"$VERSION\"|" \
                 -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/claude-dashboard.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-dashboard $VERSION"
          git push

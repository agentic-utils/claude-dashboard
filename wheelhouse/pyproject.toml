[project]
name = "claude-wheelhouse"
version = "0.1.0"
description = "Sidecar for parallel Claude Code sessions: tasks, questions, lifecycle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "textual>=8.2",
]

[project.scripts]
claude-wheelhouse = "claude_wheelhouse.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_wheelhouse"]
artifacts = ["claude_wheelhouse/plugin/**"]

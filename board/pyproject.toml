[project]
name = "claude-board"
version = "0.1.0"
description = "Sidecar board for parallel Claude Code sessions: tasks, questions, lifecycle"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "textual>=8.2",
]

[project.scripts]
claude-board = "claude_board.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_board"]
artifacts = ["claude_board/plugin/**"]
